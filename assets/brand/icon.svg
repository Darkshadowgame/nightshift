      <stop offset="0" stop-color="#2a1a08"/>
      <stop offset="0.55" stop-color="#121722"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff9a2e"/>
