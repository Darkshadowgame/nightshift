  </defs>
  <rect width="1024" height="1024" fill="#0b0f17"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- hexagon badge, same shape as the in-app pins (M20 2 36 11v18L20 38 4 29V11Z on a 40 grid) -->
