# Every push and pull request: type-check and tests. Uses no secrets.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Plate blurring module is in git
        run: |
          for f in modules/plate-redactor/ios/PlateRedactor.podspec modules/plate-redactor/ios/PlateRedactorModule.swift; do
            git ls-files --error-unmatch "$f" > /dev/null || { echo "::error::$f is missing, so iPhone builds would ship without plate blurring."; exit 1; }
          done
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --ci
