# Over-the-air update: every push to main publishes the new JavaScript to the
# "production" channel, and installed copies pick it up on their next launch.
# Native changes (new native modules, the plate module, icon) still need a new
# IPA: the fingerprint runtime version keeps an update off builds it doesn't fit.
# Needs the EXPO_TOKEN repository secret; without it the job skips publishing.

name: OTA update

# Owner, 20 Nov 2026: no automatic updates to phones until the app scores 8+ on our own review.
# Publish by hand only (Actions > OTA update > Run workflow) once that's reached.
on:
  workflow_dispatch:

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # To read the latest IPA build's runtime fingerprint (a warning if it differs).
  actions: read

defaults:
  run:
    shell: bash

jobs:
  ota-update:
    name: Publish over-the-air update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Nothing is published unless the code type-checks and every test passes.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      # Version shown in Me › App updates, e.g. v1.0.08 (one number per published update).
      - name: Set version
        run: echo "EXPO_PUBLIC_APP_VERSION=v1.0.$(printf '%02d' ${{ github.run_number }})" >> "$GITHUB_ENV"

      # Updates only reach installs whose runtime (native fingerprint) matches. Print this
      # update's, and warn when the latest IPA build was made for a different one: that
      # IPA won't get this update, so a new IPA is needed (README, "Updates").
      - name: Runtime fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH=$(npx expo-updates fingerprint:generate --platform ios | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).hash))")
          echo "Update runtime fingerprint: $HASH"
          echo "### Update runtime fingerprint: \`$HASH\`" >> "$GITHUB_STEP_SUMMARY"
          RUN=$(gh run list --workflow build-ios.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$RUN" ] && gh run download "$RUN" --name runtime-fingerprint.txt --dir "$RUNNER_TEMP/ipa-fp" 2>/dev/null; then
            IPA=$(cat "$RUNNER_TEMP/ipa-fp/runtime-fingerprint.txt")
            echo "Latest IPA runtime fingerprint: $IPA"
            if [ "$IPA" != "$HASH" ]; then
              echo "::warning::This update's runtime ($HASH) differs from the latest IPA's ($IPA). Phones on that IPA won't get it: build and install a new IPA."
              echo "**Needs a new IPA:** latest IPA runtime is \`$IPA\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No IPA fingerprint found to compare (builds from before it was recorded)."
          fi

      - name: Publish update to the production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "No EXPO_TOKEN secret; skipping the update."
            exit 0
          fi
          # The app asks the "production" channel for updates. Make the channel
          # once and point it at the production branch, then publish.
          npx --yes eas-cli@latest channel:create production --non-interactive || true
          npx --yes eas-cli@latest update --branch production --platform ios --message "$EXPO_PUBLIC_APP_VERSION: $(git log -1 --pretty=%s | cut -c1-80)" --non-interactive
          npx --yes eas-cli@latest channel:edit production --branch production --non-interactive
