# Every push to main: the quick automated scorecard (docs/REDESIGN-2.md 7.7), 20:30 at 1.0x text.
# Builds the web export, plays the ten tasks in Chromium and runs the rule checks. Uses no secrets.
# The screenshots are kept as an artifact when it fails. Can also be run by hand (Run workflow).
name: Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Scorecard
        run: npm run scorecard:quick
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard
          path: |
            e2e/scorecard/.out
            !e2e/scorecard/.out/web
          retention-days: 14
