# Turns on the open-data road closures import (docs/BACKEND.md section 7d).
# Runs only when started by hand: Actions > Turn on road closures > Run workflow.
# Safe to run again: it makes a fresh scheduler secret each time and replaces the schedule.
#
# Uses these repository secrets (values never printed):
#   SUPABASE_TOKEN       Supabase access token for the project
#   NATIONAL_HIGHWAY1    National Highways "Road and Lane Closures v2" subscription key
#                        (NATIONAL_HIGHWAY2, the secondary key, is used if the first is empty)

name: Turn on road closures

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: vuftzeianmqjboivqmws
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}

jobs:
  closures:
    name: Deploy and schedule import-closures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Make the scheduler secret
        run: |
          CRON=$(openssl rand -hex 32)
          echo "::add-mask::$CRON"
          echo "CRON_SECRET=$CRON" >> "$GITHUB_ENV"

      - name: Set the function secrets
        env:
          NH1: ${{ secrets.NATIONAL_HIGHWAY1 }}
          NH2: ${{ secrets.NATIONAL_HIGHWAY2 }}
        run: |
          NH="${NH1:-$NH2}"
          args=("CRON_SECRET=$CRON_SECRET")
          if [ -n "$NH" ]; then args+=("NATIONAL_HIGHWAYS_KEY=$NH"); else echo "::warning::No National Highways key: TfL only."; fi
          npx -y supabase@3.2.0 secrets set "${args[@]}" --project-ref "$PROJECT_REF"

      - name: Deploy import-closures
        run: npx -y supabase@3.2.0 functions deploy import-closures --use-api --project-ref "$PROJECT_REF"

      - name: Schedule it every 15 minutes
        run: |
          SQL=$(cat <<SQL
          create extension if not exists pg_cron;
          create extension if not exists pg_net;
          do \$\$ begin
            if not exists (select 1 from vault.secrets where name = 'functions_url') then
              perform vault.create_secret('https://${PROJECT_REF}.supabase.co/functions/v1', 'functions_url');
            end if;
            delete from vault.secrets where name = 'cron_secret';
            perform vault.create_secret('${CRON_SECRET}', 'cron_secret');
            if exists (select 1 from cron.job where jobname = 'import-closures') then
              perform cron.unschedule('import-closures');
            end if;
          end \$\$;
          select cron.schedule('import-closures', '*/15 * * * *', \$cron\$
            select net.http_post(
              url := (select decrypted_secret from vault.decrypted_secrets where name = 'functions_url') || '/import-closures',
              headers := jsonb_build_object('x-cron-secret', (select decrypted_secret from vault.decrypted_secrets where name = 'cron_secret')),
              body := '{}'::jsonb)
          \$cron\$);
          SQL
          )
          jq -n --arg q "$SQL" '{query: $q}' > /tmp/q.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" --data @/tmp/q.json)
          rm -f /tmp/q.json
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then cat /tmp/out.json; exit 1; fi

      - name: Run it once
        run: |
          sleep 5
          curl -sS -m 120 -X POST -H "x-cron-secret: $CRON_SECRET" \
            "https://$PROJECT_REF.supabase.co/functions/v1/import-closures" | tee /tmp/run.json
          echo
          grep -q '"imported"' /tmp/run.json
